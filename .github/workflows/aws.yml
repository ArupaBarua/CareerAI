name: Deploy CareerAI to EC2

on:
  push:
    branches: [main]

jobs:
  Continuous-Integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


  Continuous-Deployment:
    needs: Continuous-Integration
    runs-on: self-hosted

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
      LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
      EXA_MCP_URL: ${{ secrets.EXA_MCP_URL }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      REFRESH_COOKIE_NAME: ${{ secrets.REFRESH_COOKIE_NAME }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare FAISS directory
        run: mkdir -p /home/ubuntu/careerai/data/faiss

      - name: Pull latest Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
        run: docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Run database migrations
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
        run: docker run --rm -e DATABASE_URL -e OPENAI_API_KEY -e LANGSMITH_API_KEY -e LANGSMITH_TRACING -e LANGSMITH_PROJECT -e EXA_MCP_URL -e JWT_SECRET_KEY -e REFRESH_COOKIE_NAME -e NEO4J_URI -e NEO4J_USERNAME -e NEO4J_PASSWORD -e NEO4J_DATABASE $ECR_REGISTRY/$ECR_REPOSITORY:latest python -m alembic upgrade head

      - name: Remove old CareerAI container
        run: docker rm -f careerai || true

      - name: Run CareerAI container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
        run: docker run -d --name careerai --restart unless-stopped -p 8000:8000 -v /home/ubuntu/careerai/data/faiss:/app/data/faiss -e DATABASE_URL -e OPENAI_API_KEY -e LANGSMITH_API_KEY -e LANGSMITH_TRACING -e LANGSMITH_PROJECT -e EXA_MCP_URL -e JWT_SECRET_KEY -e REFRESH_COOKIE_NAME -e NEO4J_URI -e NEO4J_USERNAME -e NEO4J_PASSWORD -e NEO4J_DATABASE $ECR_REGISTRY/$ECR_REPOSITORY:latest